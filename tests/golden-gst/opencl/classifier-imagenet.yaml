---
- pipeline:
  - instance: filesrc
    location: {{input_video0}}
  - instance: decodebin
    force-sw-decoders: {{force_sw_decoders}}
    caps: video/x-raw(ANY)
    expose-all-streams: false
    connections:
      src_%u: decodebin-link0.sink
  - instance: axinplace
    lib: libinplace_addstreamid.so
    name: decodebin-link0
    mode: meta
    options: stream_id:0
  - instance: queue
    connections:
      src: inference-task0.sink_%u
    max-size-buffers: 4
    max-size-time: 0
    max-size-bytes: 0
  - instance: axinferencenet
    name: inference-task0
    model: {{model_lib0}}
    devices: metis-0:1:0
    double_buffer: true
    dmabuf_inputs: true
    dmabuf_outputs: true
    num_children: 4
    preprocess0_lib: libtransform_centrecropextra.so
    preprocess0_options: scalesize:256;crop_width:224;crop_height:224
    preprocess1_lib: libtransform_resize_cl.so
    preprocess1_options: width:224;height:224;to_tensor:1;mean:0.485,0.456,0.406;std:0.229,0.224,0.225;quant_scale:0.01863;quant_zeropoint:-14.0;format:rgba;interpolation:2
    preprocess2_lib: libtransform_padding.so
    preprocess2_options: padding:0,0,1,3,2,4,0,0;fill:-14
    postprocess0_lib: libtransform_dequantize.so
    postprocess0_options: dequant_scale:{{dequant_scale}};dequant_zeropoint:{{dequant_zeropoint}};transpose:0;dequant_lut:1
    postprocess1_lib: libdecode_classification.so
    postprocess1_options: meta_key:{{task_name}};classlabels_file:{{label_file}};top_k:5;softmax:0
  - instance: appsink
    max-buffers: 4
    drop: false
    sync: false

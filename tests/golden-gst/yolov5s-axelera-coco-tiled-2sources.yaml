- pipeline:
  - instance: filesrc
    location: {{input_video0}}
  - instance: decodebin
    force-sw-decoders: {{force_sw_decoders}}
    caps: video/x-raw(ANY)
    expose-all-streams: false
    connections:
      src_%u: decodebin-link0.sink
  - instance: axinplace
    lib: libinplace_addstreamid.so
    name: decodebin-link0
    mode: meta
    options: stream_id:0
  - instance: axtransform
    lib: libtransform_colorconvert.so
    options: format:rgba
  - instance: axinplace
    lib: libinplace_addtiles.so
    options: meta_key:axelera-tiles-internal;tile_size:640;tile_overlap:0;tile_position:none;model_width:640;model_height:640
  - instance: queue
    connections:
      src: inference-task0.sink_%u
    max-size-buffers: 4
    max-size-time: 0
    max-size-bytes: 0
  - instance: filesrc
    location: {{input_video1}}
  - instance: decodebin
    force-sw-decoders: {{force_sw_decoders}}
    caps: video/x-raw(ANY)
    expose-all-streams: false
    connections:
      src_%u: decodebin-link1.sink
  - instance: axinplace
    lib: libinplace_addstreamid.so
    name: decodebin-link1
    mode: meta
    options: stream_id:1
  - instance: axtransform
    lib: libtransform_colorconvert.so
    options: format:rgba
  - instance: axinplace
    lib: libinplace_addtiles.so
    options: meta_key:axelera-tiles-internal;tile_size:1280;tile_overlap:0;tile_position:none;model_width:640;model_height:640
  - instance: queue
    connections:
      src: inference-task0.sink_%u
    max-size-buffers: 4
    max-size-time: 0
    max-size-bytes: 0
  - instance: axinferencenet
    name: inference-task0
    model: {{model_lib0}}
    devices: metis-0:1:0
    double_buffer: true
    dmabuf_inputs: true
    dmabuf_outputs: true
    num_children: 0
    meta: axelera-tiles-internal
    preprocess0_lib: libtransform_roicrop.so
    preprocess0_options: meta_key:axelera-tiles-internal
    preprocess1_lib: libtransform_resize.so
    preprocess1_options: "width:640;height:640;padding:114;to_tensor:1;letterbox:1;scale_up:1"
    preprocess2_lib: libinplace_normalize.so
    preprocess2_options: "mean:0.;std:1.;simd:avx2;quant_scale:0.003919653594493866;quant_zeropoint:-128"
    preprocess2_mode: write
    preprocess3_lib: libtransform_padding.so
    preprocess3_options: "padding:0,0,0,0,0,0,0,52;fill:-128"
    postprocess0_lib: libdecode_yolov5.so
    postprocess0_options: "meta_key:{{task_name0}};master_meta:axelera-tiles-internal;anchors:1.25,1.625,2.0,3.75,4.125,2.875,1.875,3.8125,3.875,2.8125,3.6875,7.4375,3.625,2.8125,4.875,6.1875,11.65625,10.1875;classes:80;confidence_threshold:0.25;scales:0.08142165094614029,0.09499982744455338,0.09290479868650436;zero_points:70,82,66;topk:{{max_boxes}};multiclass:0;sigmoid_in_postprocess:0;transpose:1;classlabels_file:{{label_file}};model_width:640;model_height:640;scale_up:1;letterbox:1"
    postprocess0_mode: read
    postprocess1_lib: libinplace_nms.so
    postprocess1_options: "meta_key:{{task_name0}};flatten_meta:1;master_meta:axelera-tiles-internal;max_boxes:600;nms_threshold:0.45;class_agnostic:0;location:CPU"
  - instance: appsink
    max-buffers: 4
    drop: false
    sync: false

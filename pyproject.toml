
# FIXME issue 131
# [tool.mypy]
# ignore_missing_imports = true
# strict = true
# # If certain strict config options are too pedantic for a project,
# # disable them selectively here by setting to false.

[tool.black]
skip-string-normalization = true
# # Use the more relaxed max line length permitted in PEP8.
line-length = 99
target-version = ["py38", "py39", "py310"]
# # black will automatically exclude all files listed in .gitignore
# # If you need to exclude additional folders, consider using extend-exclude to avoid disabling the
# # default .gitignore behaviour.
extend-exclude="(data|axelera/app/fmzoo|model_recipes)"

# FIXME issue 128
[tool.isort]
profile = "black"
line_length = 99
force_sort_within_sections = true
# Inform isort of paths to import names that should be considered part of the "First Party" group.
src_paths = ["axelera", "ax_models", "ax_datasets", "ax_models/yolo/models"]
skip_gitignore = true
# If you need to skip/exclude folders, consider using skip_glob as that will allow the
# isort defaults for skip to remain without the need to duplicate them.
skip_glob = ["data/*"]
known_third_party = ["torch", "torchvision", "numpy", "PIL", "onnx", "onnxruntime"]

[tool.pip-tools]
# pip-tools 8 strips extras by default; keep them until the pins are checked against that.
strip-extras = false

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "internal_tools_tests",
    "run_tests.py",
]
# axelera_zoo is installed editable against whichever checkout was pip-installed, so
# without this a run from a git worktree imports the OTHER tree's axelera.zoo and
# tests code that is not the code under test. pytest prepends these, so they win.
pythonpath = [".", "internal_tools", "axelera_zoo/python"]
filterwarnings = """\
    ignore:.*call to `pkg_resources.declare_namespace.*:DeprecationWarning
    ignore:.*pkg_resources is deprecated as an API.*:DeprecationWarning
"""
markers = [
    "slow: marks tests that require AIPU runtime / wheel installs / minute-scale compiles (deselect with '-m \"not slow\"')",
    # Carried by the imported ALTO suite (model_axscript/llm/tests). Upstream they are
    # backed by the ax_pytest_helpers environment-filter plugin, which is not installed
    # here; registered so the imported files collect without a warning per test.
    "test_enabled: ALTO environment filter (no effect here; see model_axscript/conftest.py)",
    "regression_nightly: ALTO nightly regression selector (no effect here)",
    "alto_sanity: ALTO short-sanity selector (no effect here)",
]
# Every xfail in this repository already passes strict=True by hand. Making it the default
# means a known-failure list can only shrink: the entry that starts passing fails the run
# until somebody deletes it.
xfail_strict = true

[tool.ruff]
line-length=99
lint.ignore=['E731']
target-version='py310'
# Committed model recipes (model_recipes/) are generated + black-formatted by
# axzoo codegen and byte-gated by `axzoo drift-check`; no linter may rewrite
# them or drift-check breaks.
extend-exclude=["model_recipes"]

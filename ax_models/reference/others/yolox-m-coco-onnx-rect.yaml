axelera-model-format: 1.0.0

name: yolox-m-coco-onnx-rect

description: YOLOX-m v0.3.0 with 640x384 input for ~47% faster inference (2% mAP trade-off) vs standard 640x640.
# Input shape optimization: Rectangular inputs better match common video aspect ratios, reducing resize distortion
# 640x384: ~47% faster inference, preserves resolution for landscape-oriented content (minimal 2% mAP impact from resize)
# 640x480: ~24% faster inference, optimized for near-square content (negligible 0.3% mAP impact)

pipeline:
  - detections:
      model_name: yolox-m-coco-onnx-rect
      # YOLOX pre-0.3.0: use yolox-letterbox.yaml (RGB input format with normalization)
      # YOLOX 0.3.0+: use yolox-0.3.0-letterbox.yaml (BGR input format without normalization)
      template_path: $AXELERA_FRAMEWORK/pipeline-template/yolox-0.3.0-letterbox.yaml
      postprocess:
        - decodeyolo:
            max_nms_boxes: 30000
            conf_threshold: 0.25
            nms_iou_threshold: 0.45
            nms_class_agnostic: False
            nms_top_k: 300

models:
  yolox-m-coco-onnx-rect:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: weights/yolox_m_dynamic.onnx
    weight_url: https://media.axelera.ai/artifacts/model_cards/weights/yolo/object_detection/yolox_m_dynamic-input.onnx
    weight_md5: 242942edce2e7c89344404fee45a6a1e
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 384, 640] # [1, 3, 480, 640]
    # YOLOX pre-0.3.0 uses RGB, YOLOX 0.3.0 uses BGR
    input_color_format: BGR
    num_classes: 80
    dataset: CocoDataset-COCO2017


datasets:
  CocoDataset-COCO2017:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names
    label_type: COCO2017

axelera-model-format: 1.0.0

name: parallel-yolo11-pose-seg-retinaface

description: A parallel model combining YOLO11 pose detection, instance segmentation, and RetinaFace.

pipeline:
  - backpack_detections:
      model_name: yolo11lseg-coco-onnx
      input:
          source: no_tiles
      template_path: $AXELERA_FRAMEWORK/pipeline-template/yoloseg-letterbox.yaml
      postprocess:
        - decodeyoloseg:
            max_nms_boxes: 30000
            conf_threshold: 0.6
            nms_iou_threshold: 0.45
            nms_top_k: 300
            label_filter: ['person', 'handbag', 'backpack']

  - face_detections:
      model_name: retinaface-mobilenet0.25-widerface-onnx
      input:
          type: image
          source: no_tiles
          color_format: BGR
          imreader_backend: OpenCV
      preprocess:
          - letterbox:
              width: 640
              height: 640
              scaleup: True

          - torch-totensor:
              scale: False
          - linear-scaling: # [0,1]
              mean: 1, 1, 1
              shift: -104, -117, -123
      inference:
          handle_all: False
      postprocess:
          - decode-retinaface:
              box_format: xywh
              normalized_coord: True
              max_nms_boxes: 5000
              conf_threshold: 0.2
              nms_iou_threshold: 0.4
              nms_class_agnostic: True
              nms_top_k: 200
              eval: # overrides for evaluating accuracy
                conf_threshold: 0.02
                nms_iou_threshold: 0.5
                nms_top_k: 750
  - pose_detections:
      model_name: yolo11npose-coco
      template_path: $AXELERA_FRAMEWORK/pipeline-template/yolopose-letterbox.yaml
      postprocess:
        - decodeyolopose:
            max_nms_boxes: 30000
            conf_threshold: 0.7
            nms_iou_threshold: 0.45
            nms_top_k: 300
            eval:
              conf_threshold: 0.001
              nms_iou_threshold: 0.65
  - tracking:
      model_name: tracker
      input:
        source: full
        color_format: RGB
      cv_process:
        - tracker:
            algorithm: oc-sort
            bbox_task_name: pose_detections
            history_length: 30
            algo_params:
              max_age: 50
              min_hits: 3
              iou_threshold: 0.3
              max_id: 0

operators:
  decode-retinaface:
    class: DecodeRetinaface
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/retinaface.py


models:
  yolo11lseg-coco-onnx:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: weights/yolo11l-seg.onnx
    weight_url: https://media.axelera.ai/artifacts/model_cards/weights/yolo/instance_segmentation/yolo11l-seg.onnx
    weight_md5: 9eb9d3418c2f05329cdc4f969cfa6f21
    task_category: InstanceSegmentation
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 80
    dataset: CocoDataset-Segment-COCO2017
    extra_kwargs:
      compilation_config:
        quantization_scheme: per_tensor_min_max
        ignore_weight_buffers: False
      aipu_cores: 2

  retinaface-mobilenet0.25-widerface-onnx:
    class: AxONNXModel
    class_path: $AXELERA_FRAMEWORK/ax_models/base_onnx.py
    weight_path: weights/Retinaface_mb0.25_pytorch.onnx
    weight_url: https://media.axelera.ai/artifacts/model_cards/weights/others/object_detection/Retinaface_mb0.25_pytorch.onnx
    weight_md5: 9232a08b7056937f63ba26b6a3606546
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: BGR
    num_classes: 1
    dataset: WiderFace
    extra_kwargs:
      aipu_cores: 1
      RetinaFace:
        cfg:
          min_sizes: [[16, 32], [64, 128], [256, 512]]
          steps: [8, 16, 32]
          variance: [0.1, 0.2]
          clip: False
  yolo11npose-coco:
    class: AxUltralyticsYOLO
    class_path: $AXELERA_FRAMEWORK/ax_models/yolo/ax_ultralytics.py
    weight_path: weights/yolo11n-pose.pt
    weight_url: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n-pose.pt
    weight_md5: 475cd7f66ff9f02e47cf6546bcab42a7
    task_category: KeypointDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    num_classes: 1
    dataset: CocoDataset-keypoint-COCO2017
    extra_kwargs:
      aipu_cores: 1
      compilation_config:
        quantization_scheme: per_tensor_min_max
        ignore_weight_buffers: False
  tracker:
    model_type: CLASSICAL_CV
    task_category: ObjectTracking

datasets:
  CocoDataset-Segment-COCO2017:
    class: SegDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    label_type: COCO2017
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names
    # val_data: val2017.txt
    # mask_size: [160, 160] # 640//4
  DefaultRepresentativeDataset:
    class: DataAdapter
  WiderFace:
    class: WiderFaceDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/widerface.py
    data_dir_name: widerface
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/face.names
    # cal_data: train/label.txt
    val_data: val/label.txt
  CocoDataset-keypoint-COCO2017:
    class: KptDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    label_type: COCO2017

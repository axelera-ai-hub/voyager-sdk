axelera-model-format: 1.0.0

name: yolov4-csp-leaky-coco

description: YOLOv4 CSP leaky 640x640 (COCO)

pipeline:
  - detections:
      model_name: yolov4-csp-leaky-coco
      input:
        type: image
      preprocess:
        - letterbox:
            height: ${{input_height}}
            scaleup: true
            width: ${{input_width}}
        - torch-totensor:
      inference:
        handle_all: false
      postprocess:
        - decodeyolo:
            box_format: xywh
            conf_threshold: 0.25
            label_filter: ${{label_filter}}
            max_nms_boxes: 30000
            nms_class_agnostic: false
            nms_iou_threshold: 0.45
            nms_top_k: 300
            normalized_coord: false
            use_multi_label: false
            eval:
              conf_threshold: 0.001
              nms_class_agnostic: false
              nms_iou_threshold: 0.6
              use_multi_label: true

models:
  yolov4-csp-leaky-coco:
    class: AxYoloDarknet
    class_path: $AXELERA_FRAMEWORK/ax_models/yolo/ax_darknet.py
    task_category: ObjectDetection
    input_tensor_layout: NCHW
    input_tensor_shape: [1, 3, 640, 640]
    input_color_format: RGB
    weight_path: weights/yolov4-csp-leaky.weights
    weight_url: https://media.axelera.ai/artifacts/model_cards/weights/yolo/object_detection/yolov4-csp-leaky.weights
    weight_md5: 39dc5dd76841fa377fb84b47de86f9fa
    dataset: CocoDataset-COCO2017
    num_classes: 80
    extra_kwargs:
      darknet_cfg_path: $AXELERA_FRAMEWORK/ax_models/yolo/cfg/yolov4-csp-leaky.cfg

datasets:
  CocoDataset-COCO2017:
    class: ObjDataAdapter
    class_path: $AXELERA_FRAMEWORK/ax_datasets/objdataadapter.py
    data_dir_name: coco
    label_type: COCO2017
    labels_path: $AXELERA_FRAMEWORK/ax_datasets/labels/coco.names

operators:
  decodeyolo:
    class: DecodeYolo
    class_path: $AXELERA_FRAMEWORK/ax_models/decoders/yolo.py
